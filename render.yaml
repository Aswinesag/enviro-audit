# render.yaml - Render Blueprint Configuration
services:
  - type: web
    name: enviroaudit-api
    runtime: python
    repo: https://github.com/YOUR_USERNAME/enviroaudit
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
    buildCommand: |
      pip install -r requirements_prod.txt
      python -c "from transformers import CLIPModel, CLIPProcessor; CLIPModel.from_pretrained('openai/clip-vit-base-patch32')"
      python -c "from transformers import BlipProcessor, BlipForConditionalGeneration; BlipProcessor.from_pretrained('Salesforce/blip-image-captioning-base')"
    startCommand: python main.py